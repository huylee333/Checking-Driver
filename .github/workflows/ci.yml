name: ci

# CI = Continuous Integration: every push to main and every pull request is checked automatically.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR cancels the older run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: web/requirements*.txt

      - name: Install libraries (CPU torch)
        run: python -m pip install -r web/requirements-dev.txt

      - name: Lint (syntax errors and undefined names only)
        run: ruff check web

      - name: Run tests (no GPU, no model weights, no network)
        run: pytest web/tests -q

  docker:
    name: docker build and smoke test
    runs-on: ubuntu-latest
    needs: test                      # only build the image when lint and tests pass
    timeout-minutes: 25
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image (load it into this machine, do not publish it)
        uses: docker/build-push-action@v6
        with:
          context: web
          load: true
          tags: checking-driver:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image contains no weights, demo data or secrets
        run: |
          # "; true" inside the container: find exits with 1 when it cannot read some system folders,
          # even if it found nothing. If docker itself fails (e.g. the image is missing), the step still fails.
          out=$(docker run --rm --entrypoint sh checking-driver:ci -c "find / -xdev \( -name '*.pth' -o -name '*.npz' -o -name 'RAW_*' -o -name '.env*' -o -name '*.mp4' \) -not -path '*/site-packages/*' -not -path '/proc/*' -not -path '/sys/*' 2>/dev/null; true")
          echo "private files found in the image: [$out]"
          test -z "$out"

      - name: Container starts and answers without model weights
        run: |
          docker run -d --name app -p 7860:7860 checking-driver:ci
          code=000
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:7860/ || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          echo "GET / -> HTTP $code"
          test "$code" = "200"
          status=$(curl -fs http://localhost:7860/api/status)
          echo "$status"
          grep -q '"ready":false' <<< "$status"

      - name: Show the container log if something failed
        if: failure()
        run: docker logs app || true
