<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" font-family="Times New Roman, Times, serif" font-size="15" fill="#0b0b0b">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b8481b"/>
    </marker>
  </defs>
  <rect width="1000" height="400" fill="#ffffff"/>

  <!-- forward row -->
  <rect x="20" y="40" width="150" height="74" rx="4" fill="#ffffff" stroke="#52514e"/>
  <text x="95" y="70" text-anchor="middle">Video batch</text>
  <text x="95" y="92" text-anchor="middle" font-size="14" fill="#52514e">B = 16 clips</text>

  <rect x="210" y="40" width="220" height="74" rx="4" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="320" y="62" text-anchor="middle" font-weight="bold">DINOv3 ViT-S/16</text>
  <text x="320" y="83" text-anchor="middle" font-size="14">lr = 1e-4 (0.1 × base lr)</text>
  <text x="320" y="103" text-anchor="middle" font-size="13" fill="#52514e">logged: grad norm, weight drift</text>

  <rect x="470" y="40" width="230" height="74" rx="4" fill="#fdf0ea" stroke="#eb6834" stroke-width="1.5"/>
  <text x="585" y="62" text-anchor="middle" font-weight="bold">Temporal Transformer</text>
  <text x="585" y="83" text-anchor="middle" font-size="14">+ Linear(384 → 1024)</text>
  <text x="585" y="103" text-anchor="middle" font-size="14">lr = 1e-3</text>

  <rect x="740" y="52" width="130" height="50" rx="25" fill="#ffffff" stroke="#0b0b0b" stroke-width="1.4"/>
  <text x="805" y="82" text-anchor="middle">z (B, 1024)</text>

  <g stroke="#0b0b0b" stroke-width="1.4" marker-end="url(#ah)">
    <line x1="170" y1="77" x2="208" y2="77"/>
    <line x1="430" y1="77" x2="468" y2="77"/>
    <line x1="700" y1="77" x2="738" y2="77"/>
    <!-- z to the two loss terms -->
    <polyline points="805,102 805,140 655,140 655,168" fill="none"/>
    <polyline points="805,140 890,140 890,168" fill="none"/>
  </g>

  <!-- loss terms -->
  <rect x="520" y="170" width="270" height="70" rx="4" fill="#ffffff" stroke="#52514e"/>
  <text x="655" y="193" text-anchor="middle">Linear head (1024 → 4) → logits</text>
  <text x="655" y="215" text-anchor="middle" font-weight="bold">Cross-entropy</text>
  <text x="655" y="233" text-anchor="middle" font-size="13" fill="#52514e">label smoothing 0.1</text>

  <rect x="810" y="170" width="170" height="70" rx="4" fill="#ffffff" stroke="#52514e"/>
  <text x="895" y="193" text-anchor="middle">L2-normalise z</text>
  <text x="895" y="215" text-anchor="middle" font-weight="bold">SupCon</text>
  <text x="895" y="233" text-anchor="middle" font-size="13" fill="#52514e">temperature 0.1</text>

  <g stroke="#0b0b0b" stroke-width="1.4" marker-end="url(#ah)">
    <polyline points="655,240 655,270 745,270 745,288" fill="none"/>
    <polyline points="895,240 895,270 745,270" fill="none" marker-end="none"/>
  </g>

  <rect x="610" y="290" width="270" height="44" rx="4" fill="#fff6e0" stroke="#b8860b" stroke-width="1.5"/>
  <text x="745" y="318" text-anchor="middle" font-weight="bold">L = CE + 0.5 · SupCon</text>
  <text x="745" y="358" text-anchor="middle" font-size="13" fill="#52514e">validation loss and accuracy use plain CE</text>

  <!-- backward -->
  <g stroke="#b8481b" stroke-width="1.6" stroke-dasharray="7 5" fill="none" marker-end="url(#ahr)">
    <polyline points="610,312 320,312 320,116"/>
    <polyline points="490,312 490,116"/>
  </g>
  <text x="340" y="300" font-size="14" fill="#b8481b">backward + AdamW</text>
  <text x="340" y="330" font-size="13" fill="#b8481b">into every module</text>
</svg>
