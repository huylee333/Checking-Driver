<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="690" viewBox="0 0 1000 690" font-family="Times New Roman, Times, serif" font-size="15" fill="#0b0b0b">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b0b0b"/>
    </marker>
  </defs>
  <rect width="1000" height="690" fill="#ffffff"/>

  <!-- ===== Left: video branch (replaced) ===== -->
  <rect x="30" y="20" width="500" height="470" rx="6" fill="#fffaf7" stroke="#eb6834" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="48" y="45" font-weight="bold" fill="#b8481b">Video branch: replaced in this repo (Stage 1)</text>

  <rect x="80" y="62" width="400" height="46" rx="4" fill="#ffffff" stroke="#52514e"/>
  <text x="280" y="81" text-anchor="middle">Video clip, 77 frames over 5 s</text>
  <text x="280" y="100" text-anchor="middle" font-size="14" fill="#52514e">(B, 3, 77, 224, 224)</text>

  <rect x="80" y="132" width="400" height="36" rx="4" fill="#f2f2f0" stroke="#898781"/>
  <text x="280" y="155" text-anchor="middle">Split into B·77 independent frames</text>

  <rect x="80" y="192" width="400" height="80" rx="4" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="280" y="215" text-anchor="middle" font-weight="bold">DINOv3 ViT-S/16 (21.6M parameters)</text>
  <text x="280" y="237" text-anchor="middle" font-size="14">pretrained on LVD-1689M, fine-tuned with lr × 0.1</text>
  <text x="280" y="259" text-anchor="middle" font-size="14" fill="#52514e">CLS token of every frame → (B, 77, 384)</text>

  <rect x="80" y="296" width="400" height="36" rx="4" fill="#f2f2f0" stroke="#898781"/>
  <text x="280" y="319" text-anchor="middle" font-size="14">+ temporal position embedding, prepend temporal CLS</text>

  <rect x="80" y="356" width="400" height="56" rx="4" fill="#fdf0ea" stroke="#eb6834" stroke-width="1.5"/>
  <text x="280" y="379" text-anchor="middle" font-weight="bold">Temporal Transformer × 2</text>
  <text x="280" y="400" text-anchor="middle" font-size="14">6 heads, FFN 1536, GELU, (B, 78, 384)</text>

  <rect x="80" y="436" width="400" height="36" rx="4" fill="#fdf0ea" stroke="#eb6834" stroke-width="1.5"/>
  <text x="280" y="459" text-anchor="middle">temporal CLS → LayerNorm → Linear(384 → 1024)</text>

  <g stroke="#0b0b0b" stroke-width="1.4" marker-end="url(#ah)">
    <line x1="280" y1="108" x2="280" y2="130"/>
    <line x1="280" y1="168" x2="280" y2="190"/>
    <line x1="280" y1="272" x2="280" y2="294"/>
    <line x1="280" y1="332" x2="280" y2="354"/>
    <line x1="280" y1="412" x2="280" y2="434"/>
    <line x1="280" y1="472" x2="280" y2="558"/>
  </g>

  <!-- ===== Right: time-series branch (unchanged) ===== -->
  <rect x="570" y="20" width="400" height="470" rx="6" fill="#fafaf9" stroke="#898781" stroke-width="1.5"/>
  <text x="588" y="45" font-weight="bold" fill="#52514e">Time-series branch: unchanged (Stage 2)</text>

  <rect x="610" y="62" width="320" height="46" rx="4" fill="#ffffff" stroke="#52514e"/>
  <text x="770" y="81" text-anchor="middle">3-axis acceleration, 51 samples</text>
  <text x="770" y="100" text-anchor="middle" font-size="14" fill="#52514e">(B, 3, 51)</text>

  <rect x="610" y="132" width="320" height="36" rx="4" fill="#f2f2f0" stroke="#898781"/>
  <text x="770" y="155" text-anchor="middle">Timeseries patch partition (patch 1)</text>

  <rect x="610" y="192" width="320" height="140" rx="4" fill="#f2f2f0" stroke="#898781"/>
  <text x="770" y="222" text-anchor="middle" font-weight="bold">1D Swin Transformer</text>
  <text x="770" y="249" text-anchor="middle" font-size="14">LN → 1D SW-MSA → LN → MLP blocks</text>
  <text x="770" y="273" text-anchor="middle" font-size="14">depths [2, 2, 6, 2], 16 heads</text>
  <text x="770" y="297" text-anchor="middle" font-size="14">embed_dim 256, window 8</text>
  <text x="770" y="321" text-anchor="middle" font-size="14" fill="#52514e">(same code as upstream DuST)</text>

  <rect x="610" y="356" width="320" height="36" rx="4" fill="#f2f2f0" stroke="#898781"/>
  <text x="770" y="379" text-anchor="middle">pooled time-series feature</text>

  <g stroke="#0b0b0b" stroke-width="1.4" marker-end="url(#ah)">
    <line x1="770" y1="108" x2="770" y2="130"/>
    <line x1="770" y1="168" x2="770" y2="190"/>
    <line x1="770" y1="332" x2="770" y2="354"/>
    <line x1="770" y1="392" x2="770" y2="558"/>
  </g>

  <!-- labels on the arrows between branches and head -->
  <text x="292" y="521" font-size="14">video feature z ∈ ℝ<tspan baseline-shift="super" font-size="10">1024</tspan></text>
  <text x="292" y="540" font-size="13" fill="#52514e">(saved to disk by Stage 3)</text>
  <text x="782" y="530" font-size="14">time-series feature</text>

  <!-- ===== Fusion head (unchanged) ===== -->
  <rect x="80" y="560" width="850" height="52" rx="4" fill="#ddeef5" stroke="#52514e" stroke-width="1.2"/>
  <text x="505" y="582" text-anchor="middle" font-weight="bold">Classification head (Stage 4, unchanged)</text>
  <text x="505" y="602" text-anchor="middle" font-size="14">concatenate → Linear(num_features + 1024 → 4)</text>
  <line x1="505" y1="612" x2="505" y2="640" stroke="#0b0b0b" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="515" y="660" font-size="14">class logits: Normal, Aggressive, Drowsy</text>

  <!-- legend -->
  <rect x="30" y="652" width="16" height="12" fill="#fdf0ea" stroke="#eb6834"/>
  <text x="52" y="663" font-size="13">new module</text>
  <rect x="140" y="652" width="16" height="12" fill="#e8f1fc" stroke="#2a78d6"/>
  <text x="162" y="663" font-size="13">pretrained DINOv3</text>
  <rect x="30" y="672" width="16" height="12" fill="#f2f2f0" stroke="#898781"/>
  <text x="52" y="683" font-size="13">unchanged or reshaping step</text>
</svg>
